    language: python
    version: 3.4.2
    version_observed: '2026-07-19'
    first_release_observed: '2025-12-01'
    latest_release_observed: '2026-07-16'
    releases_published: 12
    requires_python: '>=3.11, <3.14'
    summary: >-
      Marmot Development Kit — Python SDK and CLI for the Komodo Health platform
      (Snowflake access, OAuth, MCP, and more).
    provides:
      - Python SDK (get_snowflake_connection, execute_query_async, get_query_diagnostics, SecretsAPI)
      - komodo CLI (see cli/komodo-health-cli.yml)
      - Komodo MCP server (see mcp/komodo-health-mcp.yml)
    install:
      uv: uv add komodo
      pip: pip install komodo
      pin: pip install komodo==<version>
    detail: cli/komodo-health-cli.yml

