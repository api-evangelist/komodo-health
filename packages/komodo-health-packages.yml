description: >-
  First-party client packages published by Komodo Health. Komodo ships a single
  Python distribution — `komodo`, the Marmot Development Kit — which bundles the
  SDK (Snowflake connections, async queries, secrets), the `komodo` CLI, and the
  Komodo MCP server. Additional CLI/MCP surface is delivered through the private
