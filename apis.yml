apis:
- name: Komodo Health Marmot Development Kit
  description: >-
    The Marmot Development Kit is Komodo Health's developer surface — a Python
    SDK and `komodo` CLI published to PyPI that handle OAuth 2.0 authentication,
    account selection, service-principal credentials, secrets, SQL execution
    against the account's dedicated Komodo-managed Snowflake warehouse, the
    Komodo App Builder control plane, and a first-party MCP server. Komodo does
    not publish a public OpenAPI document; the REST control plane behind the SDK
    is authentication-gated.
