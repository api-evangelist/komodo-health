aid: komodo-health
name: Komodo Health
description: >-
  Komodo Health is a healthcare technology company that combines a de-identified
  real-world data foundation — the Healthcare Map, over one trillion linked
  records covering 330M+ patients and refreshed daily — with a validated
  healthcare AI layer called Marmot, serving life sciences, payers, providers,
  financial services and consultancies. Its developer surface is the Marmot
  Development Kit: a first-party Python SDK and `komodo` CLI distributed on PyPI
  that authenticate with OAuth 2.0 (device flow for users, service-principal
  client credentials for machines) and broker access to a dedicated,
  per-account Komodo-managed Snowflake warehouse. The same package ships a
  first-party Model Context Protocol server that lets AI assistants explore
  warehouse schemas and drive the Komodo App Builder, plus a beta Cohort API for
  interactive patient-cohort exploration over ICD-10, CPT/HCPCS and NDC codes.
