response_headers:
  documented: []
  observed: []
  observation_note: >-
    api.komodohealth.com returns HTTP 401 with
    `WWW-Authenticate: Bearer realm="auth.komodohealth.com", error="invalid_token"`
    to every anonymous request, so no rate-limit headers can be observed without
    customer credentials. The response carries only date, content-type,
    content-length, www-authenticate, access-control-allow-origin,
    strict-transport-security, cache-control and pragma.

governing_controls:
  - control: Snowflake warehouse sizing
    scope: per Komodo account
    note: >-
      Each account has a dedicated Komodo-managed Snowflake warehouse. Query
      concurrency and throughput are a function of that warehouse rather than an
      API quota. Sizing is not published.
  - control: SQL LIMIT
    scope: per query
    note: Row volume is bounded client-side with SQL LIMIT, not by a server page size.
  - control: wait_until_idle timeout
    scope: per Marmot analysis call
    value: 300 seconds (default; `timeout_seconds` is caller-adjustable)
    source: https://docs.komodohealth.com/reference/sdk
    note: >-
      A client-side wait ceiling on asynchronous Marmot processing — a timeout,
      not a rate limit. Recorded because it is the only published numeric
      throughput-adjacent value in the documentation.
  - control: Snowflake query-history retention window
    scope: per account
    note: >-
      get_query_diagnostics / `komodo sql-diagnostics` only resolve a query ID
      that still falls inside Snowflake's INFORMATION_SCHEMA.QUERY_HISTORY
      retention window. The duration is not stated.

pagination_note: >-
  The only cursor-style limit surface documented is on `list_secrets`, which
  returns `.has_more` and `.next_token`. No page-size maximum is published.
  See conventions/komodo-health-conventions.yml.

