description: >-
  Komodo Health versions its developer surface as the `komodo` PyPI package —
  the Marmot Development Kit. The docs changelog page is a narrative "notable
  changes" summary rather than a dated per-release log, and defers to PyPI
  release metadata for the authoritative version list. Entries below record the
  real published versions and their release dates, plus the notable changes
  Komodo calls out; per-version change detail is not published publicly.
docs: https://docs.komodohealth.com/reference/changelog
registry: https://pypi.org/project/komodo/

versioning:
  scheme: semver
  artifact: komodo (PyPI)
  client_check: komodo --version
  pinning: 'pip install komodo==<version>  /  uv add komodo==<version>'
  dated_entries_published: false
  keep_a_changelog: false
  guidance: >-
    "When upgrading, review PyPI release notes or your internal release
    communications for breaking changes, new CLI commands, and MCP behavior."
  current: 3.4.3
  current_observed: '2026-08-15'
  current_published: '2026-07-28'

notable_changes:
  - title: Marmot chat and the Analysis API
    added_observed: '2026-08-15'
    detail: >-
      New `komodo marmot -c "<message>"` CLI command "chats through Marmot's
      Analysis API" with interactive terminal support, plus a new `MarmotApi`
      SDK client (`client.marmot`) for programmatic access — create_analysis,
      create_conversation, send_message, wait_until_idle, get_messages,
      list_files, get_file, has_access, get_status. Exceptions: MarmotApiError,
      MarmotConnectionError, TimeoutError. Documented at
      https://docs.komodohealth.com/guides-tutorials/guides/11-marmot-analyses/
    note: >-
      Not present in the 2026-07-19 capture of the docs changelog — first
      observed 2026-08-15. Komodo does not date its notable-changes entries, so
      the release that introduced it cannot be pinned from public sources.
  - title: Query error visibility and diagnostics
    detail: >-
      Failed queries now surface the full Snowflake error — message, error code,
      SQL state, and query ID — instead of a generic message. Legitimate SQL
      errors that mention words like "key" or "token" are no longer blanked out.
  - title: Self-service query diagnostics
    detail: >-
      New get_query_diagnostics(connection, query_id) SDK helper and
      `komodo sql-diagnostics <query-id>` CLI command return the error
      code/message, execution status, warehouse and timing Snowflake recorded
      for a query, so failures can be self-diagnosed without contacting Komodo
      support.

